name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Executable Conformance Suite
        working-directory: conformance
        run: python -m pytest -q -p no:cacheprovider
      - name: Run Reference Implementation tests
        working-directory: reference-implementation
        run: python -m pytest -q -p no:cacheprovider

  release-integrity:
    name: Release integrity and math
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify checksum inventories
        run: python tools/update_checksums.py --check
      - name: Validate release metadata and provenance
        run: python tools/validate_release.py --compare-baseline
      - name: Install pinned MathJax validator
        run: npm install --prefix "$RUNNER_TEMP/aof-math-validation" --ignore-scripts --no-audit --no-fund mathjax-full@3.2.2
      - name: Validate all specification formulas
        env:
          NODE_PATH: ${{ runner.temp }}/aof-math-validation/node_modules
        run: node tools/validate_math.cjs
